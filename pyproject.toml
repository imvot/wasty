[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wasty"
version = "0.1.0"
description = "Modular service stack for the Wasty trash-collecting RC robot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Hardware deps only installable/usable on the Raspberry Pi.
# picamera2 usually comes from apt (python3-picamera2); use a venv with
# --system-site-packages on the Pi.
pi = [
    "adafruit-circuitpython-servokit>=1.3",
]

[project.scripts]
wasty = "wasty.__main__:main"
wastyctl = "wasty.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP"]
